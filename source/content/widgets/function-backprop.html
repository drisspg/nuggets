<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f120e;
        --panel: #151913;
        --panel-2: #1c221a;
        --rule: #303a31;
        --text: #f0eadf;
        --muted: #9da797;
        --accent: #8da07d;
        --target: #e2b86f;
        --pred: #66d7c6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          IBM Plex Sans,
          Inter,
          system-ui,
          sans-serif;
        margin: 0;
        overscroll-behavior: none;
      }

      main {
        background:
          radial-gradient(circle at 20% 18%, rgba(102, 215, 198, 0.1), transparent 20rem),
          radial-gradient(circle at 82% 18%, rgba(226, 184, 111, 0.12), transparent 22rem),
          linear-gradient(180deg, #151913, #0f120e);
        border: 1px solid var(--rule);
        display: grid;
        gap: 1rem;
        grid-template-columns: minmax(0, 1fr) 260px;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        padding: 1rem;
      }

      .lab {
        display: grid;
        min-width: 0;
      }

      .kicker,
      label,
      button,
      select,
      .metric-name,
      .window-label {
        font-family:
          IBM Plex Mono,
          ui-monospace,
          monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .kicker {
        color: var(--accent);
        font-size: 0.68rem;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-family: Newsreader, Georgia, serif;
        font-size: clamp(1.8rem, 4vw, 3.35rem);
        letter-spacing: -0.055em;
        line-height: 0.98;
      }

      .dek {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.55;
        max-width: 54rem;
      }

      .windows {
        display: grid;
        gap: 1rem;
        grid-template-rows: minmax(320px, 1.1fr) minmax(220px, 0.9fr);
        min-height: 0;
      }

      .window {
        background: rgba(15, 18, 14, 0.72);
        border: 1px solid var(--rule);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 0;
        overflow: hidden;
      }

      .window-label {
        align-items: center;
        border-bottom: 1px solid var(--rule);
        color: var(--muted);
        display: flex;
        font-size: 0.62rem;
        justify-content: space-between;
        padding: 0.55rem 0.65rem;
      }

      .plot-wrap,
      .network-wrap {
        min-height: 0;
        position: relative;
      }

      .network-wrap {
        overflow: hidden;
      }

      canvas,
      svg {
        inset: 0;
        position: absolute;
      }

      canvas {
        height: 100%;
        width: 100%;
      }

      #plot {
        cursor: crosshair;
      }

      svg {
        height: 100%;
        pointer-events: none;
        width: 100%;
      }

      #network {
        min-height: 100%;
        min-width: 100%;
      }

      aside {
        border-left: 1px solid var(--rule);
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding-left: 1rem;
      }

      .metrics {
        display: grid;
        gap: 0.7rem;
        grid-template-columns: 1fr 1fr;
      }

      .metric {
        background: rgba(240, 234, 223, 0.035);
        border: 1px solid rgba(240, 234, 223, 0.08);
        padding: 0.7rem;
      }

      .metric.wide {
        grid-column: 1 / -1;
      }

      .metric-name {
        color: var(--muted);
        display: block;
        font-size: 0.58rem;
      }

      output {
        color: var(--text);
        display: block;
        font-family:
          IBM Plex Mono,
          ui-monospace,
          monospace;
        font-size: 1.1rem;
        font-variant-numeric: tabular-nums;
        margin-top: 0.2rem;
      }

      #sampleOut {
        min-height: 2.6em;
        white-space: pre;
      }

      .controls {
        border-top: 1px solid var(--rule);
        display: grid;
        gap: 0.8rem;
        padding-top: 1rem;
      }

      label {
        color: var(--muted);
        display: grid;
        font-size: 0.62rem;
        gap: 0.35rem;
      }

      input,
      select {
        accent-color: var(--accent);
        width: 100%;
      }

      .checkbox-label {
        align-items: center;
        display: flex;
        gap: 0.55rem;
      }

      .checkbox-label input {
        width: auto;
      }

      select {
        background: var(--panel-2);
        border: 1px solid var(--rule);
        color: var(--text);
        font-size: 0.65rem;
        padding: 0.55rem 0.6rem;
      }

      button {
        background: var(--panel-2);
        border: 1px solid var(--rule);
        color: var(--text);
        cursor: pointer;
        font-size: 0.65rem;
        padding: 0.65rem 0.7rem;
      }

      button:hover,
      select:hover {
        border-color: var(--accent);
      }

      .button-grid {
        display: grid;
        gap: 0.45rem;
        grid-template-columns: 1fr 1fr;
      }

      .file-input {
        display: none;
      }

      .legend {
        border-top: 1px solid var(--rule);
        color: var(--muted);
        display: grid;
        font-size: 0.78rem;
        gap: 0.45rem;
        line-height: 1.4;
        padding-top: 1rem;
      }

      .chip {
        border: 1px solid var(--rule);
        display: inline-block;
        height: 0.72rem;
        margin-right: 0.35rem;
        vertical-align: -0.08rem;
        width: 0.72rem;
      }

      .target-chip {
        background: var(--target);
      }

      .pred-chip {
        background: var(--pred);
      }

      .activation-chip {
        background: linear-gradient(90deg, #18211b, var(--pred));
      }

      @media (max-width: 980px) {
        main {
          grid-template-columns: 1fr;
        }

        main {
          overflow: visible;
        }

        aside {
          border-left: 0;
          border-top: 1px solid var(--rule);
          padding-left: 0;
          padding-top: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="lab">
        <div class="windows">
          <section class="window">
            <div class="window-label">
              <span>target image / prediction</span><span>drag to paint</span>
            </div>
            <div class="plot-wrap"><canvas id="plot"></canvas></div>
          </section>
          <section class="window">
            <div class="window-label">
              <span>mlp activation view</span><span id="sampleLabel">(0.00, 0.00)</span>
            </div>
            <div class="network-wrap"><svg id="network" viewBox="0 0 560 420"></svg></div>
          </section>
        </div>
      </section>
      <aside>
        <div class="metrics">
          <div class="metric">
            <span class="metric-name">step</span>
            <output id="stepOut">0</output>
          </div>
          <div class="metric">
            <span class="metric-name">loss</span>
            <output id="lossOut">0.000</output>
          </div>
          <div class="metric wide">
            <span class="metric-name">inspect pixel</span>
            <output id="sampleOut">x=0.00 y=0.00</output>
          </div>
        </div>
        <div class="controls">
          <label>
            inspect x
            <input id="inspectX" type="range" min="0" max="47" value="24" />
          </label>
          <label>
            inspect y
            <input id="inspectY" type="range" min="0" max="47" value="24" />
          </label>
          <label class="checkbox-label">
            <input id="trainOnlyInspect" type="checkbox" />
            train only inspected pixel
          </label>
          <label>
            activation
            <select id="activation">
              <option value="tanh">tanh</option>
              <option value="relu" selected>relu</option>
              <option value="sigmoid">sigmoid</option>
            </select>
          </label>
          <label>
            hidden layers
            <input id="layerCount" type="range" min="1" max="6" value="3" />
          </label>
          <label>
            neurons / layer
            <input id="hiddenCount" type="range" min="4" max="64" value="24" />
          </label>
          <label>
            learning rate <output id="lrOut">0.0010</output>
            <input id="lr" type="range" min="-5" max="-1" step="0.05" value="-3" />
          </label>
          <label>
            optimizer
            <select id="optimizer">
              <option value="sgd">sgd</option>
              <option value="adam">adam</option>
            </select>
          </label>
          <label>
            loss
            <select id="loss">
              <option value="mse">mse</option>
              <option value="l1">l1</option>
              <option value="huber">huber</option>
            </select>
          </label>
          <div class="button-grid">
            <button id="pause">pause</button>
            <button id="reset">reset net</button>
            <button id="smile">smile</button>
            <button id="rings">rings</button>
            <button id="swirl">swirl</button>
            <button id="image">image</button>
            <input id="imageFile" class="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/*" />
          </div>
        </div>
        <div class="legend">
          <p><span class="chip target-chip"></span>target image</p>
          <p><span class="chip pred-chip"></span>MLP prediction</p>
          <p><span class="chip activation-chip"></span>activation heat</p>
          <p>Click either image to choose the pixel shown in the MLP window. Drag the target to paint, or drop in an image.</p>
        </div>
      </aside>
    </main>
    <script>
      const plot = document.querySelector("#plot")
      const ctx = plot.getContext("2d")
      const network = document.querySelector("#network")
      const stepOut = document.querySelector("#stepOut")
      const lossOut = document.querySelector("#lossOut")
      const sampleOut = document.querySelector("#sampleOut")
      const sampleLabel = document.querySelector("#sampleLabel")
      const inspectXInput = document.querySelector("#inspectX")
      const inspectYInput = document.querySelector("#inspectY")
      const trainOnlyInspectInput = document.querySelector("#trainOnlyInspect")
      const activationInput = document.querySelector("#activation")
      const layerInput = document.querySelector("#layerCount")
      const hiddenInput = document.querySelector("#hiddenCount")
      const lrInput = document.querySelector("#lr")
      const lrOut = document.querySelector("#lrOut")
      const optimizerInput = document.querySelector("#optimizer")
      const lossInput = document.querySelector("#loss")
      const pauseButton = document.querySelector("#pause")
      const resetButton = document.querySelector("#reset")
      const smileButton = document.querySelector("#smile")
      const ringsButton = document.querySelector("#rings")
      const swirlButton = document.querySelector("#swirl")
      const imageButton = document.querySelector("#image")
      const imageFileInput = document.querySelector("#imageFile")

      const gridSize = 48
      const target = new Float32Array(gridSize * gridSize)
      let model
      let step = 0
      let sampleX = Math.floor(gridSize / 2)
      let sampleY = Math.floor(gridSize / 2)
      let trainCursor = 0
      let paused = false
      let drawing = false
      let initSeed = 0
      let lastLossText = "0.0000"
      let lastLossUpdate = 0
      let lastNetworkDraw = 0
      let gpuPredictionBackend = null
      let gpuPredictionUnavailable = false
      let gpuPredictionPending = false
      let gpuPredictionReady = false
      let gpuPredictionLastDispatch = 0
      const gpuPredictionValues = new Float32Array(target.length)

      function nextRandom() {
        initSeed = (1664525 * initSeed + 1013904223) >>> 0
        return initSeed / 4294967296
      }

      function rand(scale) {
        return (nextRandom() * 2 - 1) * scale
      }

      function architecture() {
        return [
          2,
          ...Array.from({ length: Number(layerInput.value) }, () => Number(hiddenInput.value)),
          1,
        ]
      }

      function resetModel() {
        initSeed = 0xdecafbad
        const dims = architecture()
        model = {
          weights: [],
          biases: [],
          weightM1: [],
          weightM2: [],
          biasM1: [],
          biasM2: [],
        }
        for (let layer = 1; layer < dims.length; layer++) {
          const fanIn = dims[layer - 1]
          model.weights.push(
            Array.from({ length: dims[layer] }, () =>
              Array.from({ length: fanIn }, () => rand(Math.sqrt(2 / fanIn))),
            ),
          )
          model.biases.push(Array.from({ length: dims[layer] }, () => rand(0.1)))
          model.weightM1.push(Array.from({ length: dims[layer] }, () => Array.from({ length: fanIn }, () => 0)))
          model.weightM2.push(Array.from({ length: dims[layer] }, () => Array.from({ length: fanIn }, () => 0)))
          model.biasM1.push(Array.from({ length: dims[layer] }, () => 0))
          model.biasM2.push(Array.from({ length: dims[layer] }, () => 0))
        }
        step = 0
        trainCursor = 0
        lastLossText = "0.0000"
        lastLossUpdate = 0
        lastNetworkDraw = 0
        gpuPredictionReady = false
      }

      function resetTrainingState() {
        step = 0
        trainCursor = 0
        lastLossText = "0.0000"
        lastLossUpdate = 0
        lastNetworkDraw = 0
        gpuPredictionReady = false
        if (!model) return
        for (let layer = 0; layer < model.weights.length; layer++) {
          for (let i = 0; i < model.weights[layer].length; i++) {
            model.biasM1[layer][i] = 0
            model.biasM2[layer][i] = 0
            for (let j = 0; j < model.weights[layer][i].length; j++) {
              model.weightM1[layer][i][j] = 0
              model.weightM2[layer][i][j] = 0
            }
          }
        }
      }

      function indexForCell(x, y) {
        return y * gridSize + x
      }

      function coordForCell(value) {
        return (value / (gridSize - 1)) * 2 - 1
      }

      function coordsForIndex(index) {
        const x = index % gridSize
        const y = Math.floor(index / gridSize)
        return [coordForCell(x), coordForCell(y), x, y]
      }

      function setTargetCell(x, y, value) {
        target[indexForCell(x, y)] = Math.max(-1, Math.min(1, value))
      }

      function activate(value, activationName) {
        switch (activationName) {
          case "relu":
            return Math.max(0, value)
          case "sigmoid":
            return 1 / (1 + Math.exp(-value))
          default:
            return Math.tanh(value)
        }
      }

      function activationDerivative(value, activated, activationName) {
        switch (activationName) {
          case "relu":
            return value > 0 ? 1 : 0
          case "sigmoid":
            return activated * (1 - activated)
          default:
            return 1 - activated * activated
        }
      }

      function forward(x, y, activationName = activationInput.value) {
        const activations = [[x, y]]
        const preactivations = []
        let current = [x, y]
        for (let layer = 0; layer < model.weights.length; layer++) {
          const weights = model.weights[layer]
          const biases = model.biases[layer]
          const z = new Array(weights.length)
          for (let i = 0; i < weights.length; i++) {
            let value = biases[i]
            for (let j = 0; j < weights[i].length; j++) value += weights[i][j] * current[j]
            z[i] = value
          }
          const isOutput = layer === model.weights.length - 1
          if (isOutput) {
            current = z
          } else {
            current = new Array(z.length)
            for (let i = 0; i < z.length; i++) current[i] = activate(z[i], activationName)
          }
          preactivations.push(z)
          activations.push(current)
        }
        return { x, y, preactivations, activations, value: Math.tanh(current[0]) }
      }

      function lossDerivative(prediction, yTarget, lossName) {
        const error = prediction - yTarget
        switch (lossName) {
          case "l1":
            return Math.sign(error)
          case "huber":
            return Math.abs(error) <= 0.25 ? error : 0.25 * Math.sign(error)
          default:
            return error
        }
      }

      function lossValue(prediction, yTarget, lossName = lossInput.value) {
        const error = prediction - yTarget
        switch (lossName) {
          case "l1":
            return Math.abs(error)
          case "huber":
            return Math.abs(error) <= 0.25 ? 0.5 * error * error : 0.25 * (Math.abs(error) - 0.125)
          default:
            return 0.5 * error * error
        }
      }

      function zeroGradients() {
        return {
          weights: model.weights.map((layer) => layer.map((row) => row.map(() => 0))),
          biases: model.biases.map((layer) => layer.map(() => 0)),
        }
      }

      function addSampleGradients(index, settings, grads) {
        const [x, y] = coordsForIndex(index)
        const cache = forward(x, y, settings.activationName)
        let delta = [lossDerivative(cache.value, target[index], settings.lossName) * (1 - cache.value * cache.value)]
        for (let layer = model.weights.length - 1; layer >= 0; layer--) {
          const weights = model.weights[layer]
          const nextDelta = layer > 0 ? new Array(weights[0].length) : null
          if (nextDelta) {
            for (let j = 0; j < nextDelta.length; j++) {
              let upstream = 0
              for (let i = 0; i < delta.length; i++) upstream += weights[i][j] * delta[i]
              nextDelta[j] =
                upstream *
                activationDerivative(cache.preactivations[layer - 1][j], cache.activations[layer][j], settings.activationName)
            }
          }
          const prev = cache.activations[layer]
          for (let i = 0; i < delta.length; i++) {
            grads.biases[layer][i] += delta[i]
            for (let j = 0; j < prev.length; j++) grads.weights[layer][i][j] += delta[i] * prev[j]
          }
          delta = nextDelta
        }
      }

      function trainBatch(settings) {
        const grads = zeroGradients()
        const batchSize = trainOnlyInspectInput.checked ? 1 : 32
        for (let i = 0; i < batchSize; i++) {
          if (trainOnlyInspectInput.checked) {
            addSampleGradients(indexForCell(sampleX, sampleY), settings, grads)
          } else {
            trainCursor = (trainCursor + 37) % target.length
            addSampleGradients(trainCursor, settings, grads)
          }
        }
        updateBatch(grads, batchSize, settings)
        step++
      }

      function learningRate() {
        return 10 ** Number(lrInput.value)
      }

      function updateLearningRateText() {
        lrOut.value = learningRate().toExponential(1)
      }

      function updateBatch(grads, batchSize, settings) {
        const beta1 = 0.9
        const beta2 = 0.999
        const t = step + 1
        const correction1 = 1 - beta1 ** t
        const correction2 = 1 - beta2 ** t
        for (let layer = 0; layer < model.weights.length; layer++) {
          for (let i = 0; i < model.weights[layer].length; i++) {
            const biasGrad = grads.biases[layer][i] / batchSize
            if (settings.optimizerName === "adam") {
              model.biasM1[layer][i] = beta1 * model.biasM1[layer][i] + (1 - beta1) * biasGrad
              model.biasM2[layer][i] = beta2 * model.biasM2[layer][i] + (1 - beta2) * biasGrad * biasGrad
              model.biases[layer][i] -=
                (settings.lr * model.biasM1[layer][i]) /
                correction1 /
                (Math.sqrt(model.biasM2[layer][i] / correction2) + 1e-8)
            } else {
              model.biases[layer][i] -= settings.lr * biasGrad
            }
            for (let j = 0; j < model.weights[layer][i].length; j++) {
              const weightGrad = grads.weights[layer][i][j] / batchSize
              if (settings.optimizerName === "adam") {
                model.weightM1[layer][i][j] = beta1 * model.weightM1[layer][i][j] + (1 - beta1) * weightGrad
                model.weightM2[layer][i][j] = beta2 * model.weightM2[layer][i][j] + (1 - beta2) * weightGrad * weightGrad
                model.weights[layer][i][j] -=
                  (settings.lr * model.weightM1[layer][i][j]) /
                  correction1 /
                  (Math.sqrt(model.weightM2[layer][i][j] / correction2) + 1e-8)
              } else {
                model.weights[layer][i][j] -= settings.lr * weightGrad
              }
            }
          }
        }
      }

      function averageLoss(activationName = activationInput.value, lossName = lossInput.value) {
        let total = 0
        let count = 0
        for (let i = 0; i < target.length; i += 5) {
          const [x, y] = coordsForIndex(i)
          total += lossValue(forward(x, y, activationName).value, target[i], lossName)
          count++
        }
        return total / count
      }

      function activationCode(activationName) {
        switch (activationName) {
          case "relu":
            return 1
          case "sigmoid":
            return 2
          default:
            return 0
        }
      }

      async function ensureGpuPredictionBackend() {
        if (gpuPredictionBackend || gpuPredictionUnavailable) return gpuPredictionBackend
        if (!("gpu" in navigator)) {
          gpuPredictionUnavailable = true
          return null
        }
        try {
          const adapter = await navigator.gpu.requestAdapter()
          if (!adapter) {
            gpuPredictionUnavailable = true
            return null
          }
          const device = await adapter.requestDevice()
          const shader = device.createShaderModule({
            code: `
              struct Params {
                layerCount: u32,
                hiddenCount: u32,
                activation: u32,
                pad: u32,
              }

              @group(0) @binding(0) var<storage, read> weights: array<f32>;
              @group(0) @binding(1) var<storage, read> biases: array<f32>;
              @group(0) @binding(2) var<storage, read_write> predictions: array<f32>;
              @group(0) @binding(3) var<uniform> params: Params;

              fn applyActivation(value: f32) -> f32 {
                if (params.activation == 1u) {
                  return max(0.0, value);
                }
                if (params.activation == 2u) {
                  return 1.0 / (1.0 + exp(-value));
                }
                return tanh(value);
              }

              @compute @workgroup_size(64)
              fn main(@builtin(global_invocation_id) id: vec3<u32>) {
                let index = id.x;
                if (index >= 2304u) {
                  return;
                }
                let px = index % 48u;
                let py = index / 48u;
                var current: array<f32, 64>;
                var next: array<f32, 64>;
                current[0] = (f32(px) / 47.0) * 2.0 - 1.0;
                current[1] = (f32(py) / 47.0) * 2.0 - 1.0;
                var inputSize = 2u;
                var weightOffset = 0u;
                var biasOffset = 0u;
                for (var layer = 0u; layer < params.layerCount; layer = layer + 1u) {
                  let isOutput = layer == params.layerCount - 1u;
                  let outputSize = select(params.hiddenCount, 1u, isOutput);
                  for (var i = 0u; i < outputSize; i = i + 1u) {
                    var value = biases[biasOffset + i];
                    for (var j = 0u; j < inputSize; j = j + 1u) {
                      value = value + weights[weightOffset + i * inputSize + j] * current[j];
                    }
                    next[i] = select(applyActivation(value), value, isOutput);
                  }
                  weightOffset = weightOffset + inputSize * outputSize;
                  biasOffset = biasOffset + outputSize;
                  inputSize = outputSize;
                  for (var i = 0u; i < outputSize; i = i + 1u) {
                    current[i] = next[i];
                  }
                }
                predictions[index] = tanh(current[0]);
              }
            `,
          })
          gpuPredictionBackend = {
            device,
            pipeline: await device.createComputePipelineAsync({
              layout: "auto",
              compute: { module: shader, entryPoint: "main" },
            }),
          }
          return gpuPredictionBackend
        } catch {
          gpuPredictionUnavailable = true
          return null
        }
      }

      function packedModelBuffers() {
        const weights = []
        const biases = []
        for (let layer = 0; layer < model.weights.length; layer++) {
          for (let i = 0; i < model.weights[layer].length; i++) {
            biases.push(model.biases[layer][i])
            for (let j = 0; j < model.weights[layer][i].length; j++) weights.push(model.weights[layer][i][j])
          }
        }
        return {
          weights: new Float32Array(weights),
          biases: new Float32Array(biases),
        }
      }

      function gpuBufferFromData(device, data, usage) {
        const buffer = device.createBuffer({
          size: Math.max(4, data.byteLength),
          usage: usage | GPUBufferUsage.COPY_DST,
        })
        device.queue.writeBuffer(buffer, 0, data)
        return buffer
      }

      function updateGpuPredictions(activationName, now) {
        if (gpuPredictionUnavailable || gpuPredictionPending || now - gpuPredictionLastDispatch < 100) return
        gpuPredictionPending = true
        gpuPredictionLastDispatch = now
        dispatchGpuPredictions(activationName)
          .catch(() => {
            gpuPredictionUnavailable = true
          })
          .finally(() => {
            gpuPredictionPending = false
          })
      }

      async function dispatchGpuPredictions(activationName) {
        const backend = await ensureGpuPredictionBackend()
        if (!backend) return
        const { device, pipeline } = backend
        const packed = packedModelBuffers()
        const weightsBuffer = gpuBufferFromData(device, packed.weights, GPUBufferUsage.STORAGE)
        const biasesBuffer = gpuBufferFromData(device, packed.biases, GPUBufferUsage.STORAGE)
        const outputBuffer = device.createBuffer({
          size: gpuPredictionValues.byteLength,
          usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
        })
        const readbackBuffer = device.createBuffer({
          size: gpuPredictionValues.byteLength,
          usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
        })
        const paramsBuffer = gpuBufferFromData(
          device,
          new Uint32Array([model.weights.length, Number(hiddenInput.value), activationCode(activationName), 0]),
          GPUBufferUsage.UNIFORM,
        )
        const bindGroup = device.createBindGroup({
          layout: pipeline.getBindGroupLayout(0),
          entries: [
            { binding: 0, resource: { buffer: weightsBuffer } },
            { binding: 1, resource: { buffer: biasesBuffer } },
            { binding: 2, resource: { buffer: outputBuffer } },
            { binding: 3, resource: { buffer: paramsBuffer } },
          ],
        })
        const encoder = device.createCommandEncoder()
        const pass = encoder.beginComputePass()
        pass.setPipeline(pipeline)
        pass.setBindGroup(0, bindGroup)
        pass.dispatchWorkgroups(Math.ceil(target.length / 64))
        pass.end()
        encoder.copyBufferToBuffer(outputBuffer, 0, readbackBuffer, 0, gpuPredictionValues.byteLength)
        device.queue.submit([encoder.finish()])
        await readbackBuffer.mapAsync(GPUMapMode.READ)
        gpuPredictionValues.set(new Float32Array(readbackBuffer.getMappedRange()).subarray(0, target.length))
        gpuPredictionReady = true
        readbackBuffer.unmap()
        weightsBuffer.destroy()
        biasesBuffer.destroy()
        outputBuffer.destroy()
        readbackBuffer.destroy()
        paramsBuffer.destroy()
      }

      function resizeCanvas() {
        const rect = plot.getBoundingClientRect()
        const dpr = window.devicePixelRatio || 1
        plot.width = Math.max(1, Math.floor(rect.width * dpr))
        plot.height = Math.max(1, Math.floor(rect.height * dpr))
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
        return rect
      }

      function panels(rect) {
        const gap = 16
        const labelHeight = 24
        const size = Math.min((rect.width - gap - 48) / 2, rect.height - labelHeight - 36)
        const top = labelHeight + Math.max(12, (rect.height - labelHeight - size) / 2)
        const left = Math.max(16, (rect.width - size * 2 - gap) / 2)
        return [
          { x: left, y: top, size, title: "target" },
          { x: left + size + gap, y: top, size, title: "prediction" },
        ]
      }

      function valueToColor(value) {
        const t = (Math.max(-1, Math.min(1, value)) + 1) / 2
        const dark = [16, 19, 15]
        const warm = [226, 184, 111]
        const cool = [102, 215, 198]
        const from = t < 0.5 ? dark : warm
        const to = t < 0.5 ? warm : cool
        const mix = t < 0.5 ? t * 2 : (t - 0.5) * 2
        return `rgb(${from.map((channel, i) => Math.round(channel * (1 - mix) + to[i] * mix)).join(",")})`
      }

      function drawImagePanel(panel, getValue) {
        const cell = panel.size / gridSize
        ctx.fillStyle = "#10130f"
        ctx.fillRect(panel.x, panel.y, panel.size, panel.size)
        for (let y = 0; y < gridSize; y++) {
          for (let x = 0; x < gridSize; x++) {
            ctx.fillStyle = valueToColor(getValue(x, y))
            ctx.fillRect(panel.x + x * cell, panel.y + y * cell, Math.ceil(cell), Math.ceil(cell))
          }
        }
        ctx.strokeStyle = "rgba(240, 234, 223, 0.22)"
        ctx.lineWidth = 1
        ctx.strokeRect(panel.x, panel.y, panel.size, panel.size)
        ctx.fillStyle = "#9da797"
        ctx.font = "12px IBM Plex Mono, monospace"
        ctx.textAlign = "center"
        ctx.fillText(panel.title, panel.x + panel.size / 2, panel.y - 9)
      }

      function drawCursor(panel) {
        const cell = panel.size / gridSize
        const x = panel.x + sampleX * cell + cell / 2
        const y = panel.y + sampleY * cell + cell / 2
        ctx.strokeStyle = "rgba(240, 234, 223, 0.82)"
        ctx.lineWidth = 1.5
        ctx.beginPath()
        ctx.arc(x, y, Math.max(5, cell * 1.3), 0, Math.PI * 2)
        ctx.stroke()
      }

      function drawPlot(now) {
        const rect = resizeCanvas()
        const [targetPanel, predictionPanel] = panels(rect)
        const activationName = activationInput.value
        updateGpuPredictions(activationName, now)
        ctx.clearRect(0, 0, rect.width, rect.height)
        ctx.fillStyle = "#10130f"
        ctx.fillRect(0, 0, rect.width, rect.height)
        drawImagePanel(targetPanel, (x, y) => target[indexForCell(x, y)])
        drawImagePanel(predictionPanel, (x, y) =>
          gpuPredictionReady ? gpuPredictionValues[indexForCell(x, y)] : forward(coordForCell(x), coordForCell(y), activationName).value,
        )
        drawCursor(targetPanel)
        drawCursor(predictionPanel)
      }

      function svgEl(name, attrs) {
        const node = document.createElementNS("http://www.w3.org/2000/svg", name)
        for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value)
        return node
      }

      function colorForActivation(value) {
        const t = Math.min(1, Math.abs(value))
        return value >= 0
          ? `rgba(102, 215, 198, ${0.14 + t * 0.74})`
          : `rgba(226, 184, 111, ${0.14 + t * 0.74})`
      }

      function drawNetwork() {
        const cache = forward(coordForCell(sampleX), coordForCell(sampleY), activationInput.value)
        const horizontalSpan = 468
        const verticalSpan = 316
        const layers = cache.activations.map((values, layer) =>
          values.map((value, i) => ({
            x: 46 + layer * (horizontalSpan / (cache.activations.length - 1)),
            y: 52 + i * (verticalSpan / Math.max(1, values.length - 1)),
            label:
              layer === 0
                ? i === 0
                  ? "x"
                  : "y"
                : layer === cache.activations.length - 1
                  ? "px"
                  : `h${layer}.${i + 1}`,
            value,
          })),
        )
        network.replaceChildren()
        for (let layer = 0; layer < model.weights.length; layer++) {
          for (let i = 0; i < layers[layer + 1].length; i++) {
            for (let j = 0; j < layers[layer].length; j++)
              drawEdge(layers[layer][j], layers[layer + 1][i], model.weights[layer][i][j])
          }
        }
        for (const layer of layers) for (const node of layer) drawNode(node)
        const targetText = svgEl("text", {
          x: 506,
          y: 400,
          fill: "#9da797",
          "font-family": "IBM Plex Mono, monospace",
          "font-size": 12,
          "text-anchor": "end",
        })
        targetText.textContent = `target ${target[indexForCell(sampleX, sampleY)].toFixed(2)}`
        network.append(targetText)
      }

      function drawEdge(a, b, weight) {
        const mx = (a.x + b.x) / 2
        network.append(
          svgEl("path", {
            d: `M${a.x} ${a.y} C${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}`,
            fill: "none",
            stroke: weight >= 0 ? "#66d7c6" : "#e2b86f",
            "stroke-linecap": "round",
            "stroke-width": 0.45 + Math.min(Math.abs(weight), 2.4) * 1.45,
            opacity: 0.1 + Math.min(Math.abs(weight), 2.4) * 0.1,
          }),
        )
      }

      function drawNode(node) {
        network.append(
          svgEl("circle", {
            cx: node.x,
            cy: node.y,
            r: 12 + Math.min(1, Math.abs(node.value)) * 6,
            fill: colorForActivation(node.value),
            stroke: "rgba(240, 234, 223, 0.45)",
            "stroke-width": 1.2,
          }),
        )
        const label = svgEl("text", {
          x: node.x,
          y: node.y + 4,
          fill: "#f0eadf",
          "font-family": "IBM Plex Mono, monospace",
          "font-size": 9,
          "text-anchor": "middle",
        })
        label.textContent = node.label
        network.append(label)
      }

      function eventCell(event) {
        const rect = plot.getBoundingClientRect()
        const eventX = event.clientX - rect.left
        const eventY = event.clientY - rect.top
        const panel = panels(rect).find(
          (candidate) =>
            eventX >= candidate.x &&
            eventX <= candidate.x + candidate.size &&
            eventY >= candidate.y &&
            eventY <= candidate.y + candidate.size,
        )
        if (!panel) return null
        return {
          x: Math.max(0, Math.min(gridSize - 1, Math.floor(((eventX - panel.x) / panel.size) * gridSize))),
          y: Math.max(0, Math.min(gridSize - 1, Math.floor(((eventY - panel.y) / panel.size) * gridSize))),
          panel: panel.title,
        }
      }

      function setTargetAtEvent(event) {
        const cell = eventCell(event)
        if (!cell) return false
        if (cell.panel !== "target") {
          setSample(cell.x, cell.y)
          return false
        }
        for (let dy = -3; dy <= 3; dy++) {
          for (let dx = -3; dx <= 3; dx++) {
            const x = Math.max(0, Math.min(gridSize - 1, cell.x + dx))
            const y = Math.max(0, Math.min(gridSize - 1, cell.y + dy))
            const distance = Math.hypot(dx, dy)
            const blend = Math.max(0, 1 - distance / 4)
            const index = indexForCell(x, y)
            target[index] = target[index] * (1 - blend) + blend
          }
        }
        setSample(cell.x, cell.y)
        return true
      }

      function selectSample(event) {
        const cell = eventCell(event)
        if (cell) setSample(cell.x, cell.y)
      }

      function setSample(x, y) {
        sampleX = x
        sampleY = y
        inspectXInput.value = String(x)
        inspectYInput.value = String(y)
      }

      function updateText(now) {
        const x = coordForCell(sampleX)
        const y = coordForCell(sampleY)
        const activationName = activationInput.value
        const prediction = forward(x, y, activationName).value
        const targetValue = target[indexForCell(sampleX, sampleY)]
        if (now - lastLossUpdate > 250) {
          lastLossText = averageLoss(activationName, lossInput.value).toFixed(4)
          lastLossUpdate = now
        }
        stepOut.value = String(step)
        lossOut.value = lastLossText
        sampleOut.value = `x=${x.toFixed(2).padStart(5)} y=${y.toFixed(2).padStart(5)}\nt=${targetValue.toFixed(2).padStart(5)} / px=${prediction.toFixed(2).padStart(5)}`
        sampleLabel.textContent = `(${x.toFixed(2)}, ${y.toFixed(2)}) · ${activationName} · ${layerInput.value} layer${layerInput.value === "1" ? "" : "s"}`
        updateLearningRateText()
      }

      function trainingSettings() {
        return {
          activationName: activationInput.value,
          lossName: lossInput.value,
          lr: learningRate(),
          optimizerName: optimizerInput.value,
        }
      }

      function trainUntilNextFrame(now) {
        const deadline = now + 10
        const settings = trainingSettings()
        do {
          for (let i = 0; i < 4; i++) trainBatch(settings)
        } while (performance.now() < deadline)
      }

      function tick(now) {
        if (!paused) trainUntilNextFrame(now)
        drawPlot(now)
        if (now - lastNetworkDraw > 100) {
          drawNetwork()
          lastNetworkDraw = now
        }
        updateText(now)
        requestAnimationFrame(tick)
      }

      function fillTarget(fn) {
        for (let y = 0; y < gridSize; y++) {
          for (let x = 0; x < gridSize; x++) setTargetCell(x, y, fn(coordForCell(x), coordForCell(y), x, y))
        }
      }

      function smileTarget() {
        fillTarget((x, y) => {
          const head = Math.hypot(x, y) < 0.92 ? 0.25 : -0.85
          const leftEye = Math.exp(-85 * ((x + 0.32) ** 2 + (y + 0.28) ** 2))
          const rightEye = Math.exp(-85 * ((x - 0.32) ** 2 + (y + 0.28) ** 2))
          const mouth = Math.exp(-120 * (Math.hypot(x, y - 0.05) - 0.48) ** 2) * (y > 0.05 ? 1 : 0)
          return head - leftEye * 1.2 - rightEye * 1.2 + mouth * 1.1
        })
      }

      function ringsTarget() {
        fillTarget((x, y) => Math.cos(Math.hypot(x, y) * 22) * Math.exp(-0.9 * (x * x + y * y)))
      }

      function swirlTarget() {
        fillTarget((x, y) => {
          const angle = Math.atan2(y, x)
          const radius = Math.hypot(x, y)
          return Math.sin(angle * 3 + radius * 13) * Math.exp(-0.45 * radius)
        })
      }

      function loadImageFile(file) {
        if (!file || !file.type.startsWith("image/")) return
        const image = new Image()
        const url = URL.createObjectURL(file)
        image.addEventListener("load", () => {
          const canvas = document.createElement("canvas")
          canvas.width = gridSize
          canvas.height = gridSize
          const imageCtx = canvas.getContext("2d", { willReadFrequently: true })
          imageCtx.fillStyle = "black"
          imageCtx.fillRect(0, 0, gridSize, gridSize)
          const scale = Math.min(gridSize / image.width, gridSize / image.height)
          const width = image.width * scale
          const height = image.height * scale
          imageCtx.drawImage(image, (gridSize - width) / 2, (gridSize - height) / 2, width, height)
          const data = imageCtx.getImageData(0, 0, gridSize, gridSize).data
          for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < gridSize; x++) {
              const offset = indexForCell(x, y) * 4
              const alpha = data[offset + 3] / 255
              const luminance = (0.2126 * data[offset] + 0.7152 * data[offset + 1] + 0.0722 * data[offset + 2]) / 255
              setTargetCell(x, y, (luminance * alpha) * 2 - 1)
            }
          }
          resetTrainingState()
          URL.revokeObjectURL(url)
        })
        image.src = url
      }

      plot.addEventListener("pointerdown", (event) => {
        drawing = setTargetAtEvent(event)
        if (drawing) plot.setPointerCapture(event.pointerId)
      })
      plot.addEventListener("pointermove", (event) => {
        if (drawing) setTargetAtEvent(event)
      })
      plot.addEventListener("pointerup", () => {
        drawing = false
      })
      plot.addEventListener("click", selectSample)
      plot.addEventListener("dragover", (event) => {
        event.preventDefault()
      })
      plot.addEventListener("drop", (event) => {
        event.preventDefault()
        loadImageFile(event.dataTransfer.files[0])
      })
      inspectXInput.addEventListener("input", () => {
        sampleX = Number(inspectXInput.value)
      })
      inspectYInput.addEventListener("input", () => {
        sampleY = Number(inspectYInput.value)
      })
      hiddenInput.addEventListener("input", resetModel)
      layerInput.addEventListener("input", resetModel)
      activationInput.addEventListener("change", resetModel)
      optimizerInput.addEventListener("change", resetModel)
      lossInput.addEventListener("change", resetTrainingState)
      pauseButton.addEventListener("click", () => {
        paused = !paused
        pauseButton.textContent = paused ? "resume" : "pause"
      })
      resetButton.addEventListener("click", resetModel)
      smileButton.addEventListener("click", () => {
        smileTarget()
        resetTrainingState()
      })
      ringsButton.addEventListener("click", () => {
        ringsTarget()
        resetTrainingState()
      })
      swirlButton.addEventListener("click", () => {
        swirlTarget()
        resetTrainingState()
      })
      imageButton.addEventListener("click", () => {
        imageFileInput.click()
      })
      imageFileInput.addEventListener("change", () => {
        loadImageFile(imageFileInput.files[0])
        imageFileInput.value = ""
      })
      smileTarget()
      resetModel()
      requestAnimationFrame(tick)
    </script>
  </body>
</html>
