<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="286" viewBox="0 0 1080 286">
  <!-- Adding kernels to PyTorch core is the least leveraged thing — standalone lower banner for the 1200x630 social card. Palette: paper #f4f0e8, ink #1a2e22, sage #5f7f67, amber #b98049, red #aa413a. -->
  <rect width="1080" height="286" fill="#f4f0e8"/>
  <path d="M0 34H1080 M0 68H1080 M0 102H1080 M0 136H1080 M0 170H1080 M0 204H1080 M0 238H1080 M0 272H1080" stroke="#d0ccc4" stroke-width="1" opacity="0.35"/>
  <!-- ground -->
  <path d="M40 254H1040" stroke="#1a2e22" stroke-width="2"/>
  <!-- rest position of the beam, for reference -->
  <path d="M190 187.64H1010" stroke="#1a2e22" stroke-width="1.2" stroke-dasharray="5 7" opacity=".3"/>
  <!-- fulcrum: rounded pivot -->
  <path d="M730 254 V214 A30 30 0 0 1 790 214 V254 Z" fill="#1a2e22"/>
  <path d="M714 254h92" stroke="#1a2e22" stroke-width="6" stroke-linecap="round"/>
  <!-- everything riding the beam -->
  <g transform="rotate(-4.25 760 187.64)">
    <path d="M110 187.64H1010" stroke="#1a2e22" stroke-width="12" stroke-linecap="round"/>
    <!-- amber pin at the pivot -->
    <circle cx="760" cy="187.64" r="9" fill="#b98049"/>
    <circle cx="760" cy="187.64" r="3.5" fill="#f4f0e8"/>
    <g transform="translate(0 181.64)">
      <rect x="838" y="-33" width="40" height="22" rx="3" fill="#1a2e22"/>
      <path d="M847 -25h22M847 -19h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="881" y="-33" width="40" height="22" rx="3" fill="#5f7f67"/>
      <path d="M890 -25h22M890 -19h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="924" y="-33" width="40" height="22" rx="3" fill="#5f7f67"/>
      <path d="M933 -25h22M933 -19h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="967" y="-33" width="40" height="22" rx="3" fill="#1a2e22"/>
      <path d="M976 -25h22M976 -19h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="864" y="-58" width="40" height="22" rx="3" fill="#5f7f67"/>
      <path d="M873 -50h22M873 -44h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="907" y="-58" width="40" height="22" rx="3" fill="#5f7f67"/>
      <path d="M916 -50h22M916 -44h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="950" y="-58" width="40" height="22" rx="3" fill="#1a2e22"/>
      <path d="M959 -50h22M959 -44h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="858" y="-83" width="40" height="22" rx="3" fill="#5f7f67"/>
      <path d="M867 -75h22M867 -69h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="901" y="-83" width="40" height="22" rx="3" fill="#1a2e22"/>
      <path d="M910 -75h22M910 -69h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="944" y="-83" width="40" height="22" rx="3" fill="#5f7f67"/>
      <path d="M953 -75h22M953 -69h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="884" y="-108" width="40" height="22" rx="3" fill="#1a2e22"/>
      <path d="M893 -100h22M893 -94h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="927" y="-108" width="40" height="22" rx="3" fill="#5f7f67"/>
      <path d="M936 -100h22M936 -94h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
      <rect x="898" y="-133" width="40" height="22" rx="3" fill="#5f7f67"/>
      <path d="M907 -125h22M907 -119h14" stroke="#f4f0e8" stroke-width="1.6" opacity=".7"/>
    </g>
  </g>
  <!-- one abstraction on the long arm -->
  <circle cx="140" cy="199.77" r="30" fill="#b98049"/>
  <circle cx="140" cy="199.77" r="20" fill="none" stroke="#f4f0e8" stroke-width="2" opacity=".7"/>
  <circle cx="140" cy="199.77" r="6" fill="#f4f0e8"/>
  <!-- motion: press down here, lift there -->
  <path d="M140 96V150" stroke="#b98049" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M130 140l10 12 10-12" fill="none" stroke="#b98049" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1034 150V70" stroke="#5f7f67" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M1024 82l10-12 10 12" fill="none" stroke="#5f7f67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arc of travel -->
  <path d="M140 167.77 A650 650 0 0 0 162 229.77" fill="none" stroke="#1a2e22" stroke-width="1" stroke-dasharray="3 5" opacity=".45"/>
</svg>
