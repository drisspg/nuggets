<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="286" viewBox="0 0 1080 286">
  <!-- TorchInductor Walkthrough — the post's x.sum(1) + (y + 3).sum(1) scheduler example: op1 and op2 fuse into op1_op2, op0 stays its own kernel (numel/rnumel mismatch). Palette: paper #f4f0e8, ink #1a2e22, sage #5f7f67, amber #b98049, red #aa413a, rule #d0ccc4. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1a2e22"/>
    </marker>
  </defs>
  <rect width="1080" height="286" fill="#f4f0e8"/>
  <path d="M0 34H1080 M0 68H1080 M0 102H1080 M0 136H1080 M0 170H1080 M0 204H1080 M0 238H1080 M0 272H1080" stroke="#d0ccc4" stroke-width="1" opacity="0.35"/>

  <g font-family="IBM Plex Sans" font-weight="600" text-anchor="middle">
    <!-- inputs: x is [10, 50], y is [10, 60]; the reduction lengths differ -->
    <g fill="#5f7f67" fill-opacity=".22" stroke="#1a2e22" stroke-width="2">
      <rect x="96" y="54" width="120" height="64" rx="6"/>
      <rect x="96" y="164" width="144" height="64" rx="6"/>
    </g>
    <path d="M120 54v64M144 54v64M168 54v64M192 54v64 M120 164v64M144 164v64M168 164v64M192 164v64M216 164v64" stroke="#1a2e22" stroke-width="1.4" opacity=".45"/>
    <text x="78" y="95" font-size="26" fill="#1a2e22" text-anchor="end">x</text>
    <text x="78" y="205" font-size="26" fill="#1a2e22" text-anchor="end">y</text>

    <!-- op0 stays its own kernel -->
    <rect x="324" y="34" width="128" height="112" rx="22" fill="none" stroke="#5f7f67" stroke-width="3" stroke-dasharray="9 7"/>

    <!-- fused kernel op1_op2 -->
    <rect x="532" y="138" width="430" height="124" rx="26" fill="#b98049" fill-opacity=".22" stroke="#b98049" stroke-width="3.5"/>
    <text x="944" y="250" font-size="20" fill="#8a5c30" text-anchor="end">op1_op2</text>

    <!-- edges -->
    <g fill="none" stroke="#1a2e22" stroke-width="3" marker-end="url(#arrow)">
      <path d="M216 90H340"/>
      <path d="M240 200H582"/>
      <path d="M670 200H790"/>
      <path d="M878 200H994"/>
      <path d="M428 90H838V152"/>
    </g>

    <!-- output [10] -->
    <rect x="1002" y="168" width="30" height="64" rx="5" fill="#b98049" fill-opacity=".35" stroke="#1a2e22" stroke-width="2"/>
    <!-- op0 → op2 carries buf0, but fusing op0 into op1_op2 is refused: numel/rnumel mismatch -->
    <circle cx="660" cy="90" r="25" fill="#f4f0e8" stroke="#aa413a" stroke-width="3.5"/>
    <path d="M650 80l20 20M670 80l-20 20" stroke="#aa413a" stroke-width="4.5" stroke-linecap="round"/>
    <text x="660" y="50" font-size="21" fill="#aa413a">numel mismatch</text>

    <!-- scheduler nodes -->
    <g fill="#f4f0e8" stroke="#1a2e22" stroke-width="3">
      <circle cx="388" cy="90" r="40"/>
      <circle cx="630" cy="200" r="40"/>
      <circle cx="838" cy="200" r="40"/>
    </g>
    <g font-size="25" fill="#1a2e22">
      <text x="388" y="99">op0</text>
      <text x="630" y="209">op1</text>
      <text x="838" y="209">op2</text>
    </g>
  </g>
</svg>
